name: Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy installieren
        uses: aquasecurity/setup-trivy@v0.2.6

      - name: Repository prüfen
        run: trivy config .